name: Jobsheet - Stale Index Read-only Regression

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  JOBSHEET_RCLONE_RELEASE: '1.75.0'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sample: [B01, B02, B03, B04]
        date_mode: [normal, missing]
        include:
          - sample: B01
            kind: PM
          - sample: B02
            kind: CM
          - sample: B03
            kind: PM
          - sample: B04
            kind: CM
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install rclone
        run: |
          curl --fail --location --output rclone.zip "https://downloads.rclone.org/v${JOBSHEET_RCLONE_RELEASE}/rclone-v${JOBSHEET_RCLONE_RELEASE}-linux-amd64.zip"
          unzip -q rclone.zip
          sudo mv "rclone-v${JOBSHEET_RCLONE_RELEASE}-linux-amd64/rclone" /usr/local/bin/rclone
      - name: Restore credentials and download private regression fixtures
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG }}
          STALE_SAMPLE: ${{ matrix.sample }}
          STALE_JOB_TYPE: ${{ matrix.kind }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          FIXTURE_ROOT="googledrive:From_BrotherDevice/.jobsheet-control/stale-index-regression-20261116"
          rclone copyto "$FIXTURE_ROOT/asana-device-index.json.gz" /tmp/asana-device-index.json.gz
          gzip -dc /tmp/asana-device-index.json.gz > /tmp/asana-device-index.json
          rclone copyto "$FIXTURE_ROOT/asana-device-index-manifest.json" /tmp/asana-device-index-manifest.json
          rclone copyto "$FIXTURE_ROOT/${STALE_SAMPLE}_${STALE_JOB_TYPE}.pdf" /tmp/jobsheet.pdf
      - name: Read real images and live Asana with the frozen index
        env:
          STALE_SAMPLE: ${{ matrix.sample }}
          STALE_JOB_TYPE: ${{ matrix.kind }}
          DATE_MODE: ${{ matrix.date_mode }}
          JOBSHEET_MATCHING_RULES: evidence-live-v2
          JOBSHEET_DRY_RUN: 'true'
          OCR_PROVIDER: nvidia
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          ASANA_WORKSPACE_GID: ${{ vars.ASANA_WORKSPACE_GID }}
        run: python -m scripts.check_stale_index_readonly
      - name: Remove runner credentials
        if: always()
        run: shred -u ~/.config/rclone/rclone.conf 2>/dev/null || true
