name: Jobsheet Stage A - Split

# 階段 A：拆刀手。只由「掃描器上傳（Apps Script 觸發）」或手動啟動，不再排程空轉。
on:
  repository_dispatch:
    types: [jobsheet-uploaded]   # 掃描器上傳新 PDF → Apps Script 觸發
  workflow_dispatch:             # 手動觸發

permissions:
  contents: read

env:
  # 不可命名為 RCLONE_VERSION；rclone 會把 RCLONE_* 環境變數
  # 當成自己的命令選項，將 1.75.0 誤當成布林值而拒絕啟動。
  JOBSHEET_RCLONE_RELEASE: '1.75.0'

concurrency:
  group: jobsheet-split
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install rclone
        run: |
          curl --fail --location --output rclone.zip \
            "https://downloads.rclone.org/v${JOBSHEET_RCLONE_RELEASE}/rclone-v${JOBSHEET_RCLONE_RELEASE}-linux-amd64.zip"
          unzip -q rclone.zip
          sudo mv "rclone-v${JOBSHEET_RCLONE_RELEASE}-linux-amd64/rclone" /usr/local/bin/
          rclone version
      - name: Restore rclone config
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Show queue before processing
        run: python -m src.healthcheck
      - name: Run splitter
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
        run: python -m src.splitter
      - name: Cleanup rclone config
        if: always()
        run: shred -u ~/.config/rclone/rclone.conf 2>/dev/null || true
