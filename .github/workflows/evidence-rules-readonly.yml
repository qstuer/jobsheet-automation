name: Jobsheet - Integrated Evidence Rules Read-only
on:
  push:
    branches: [codex/evidence-rules-20261005, codex/release-evidence-20261005]
    paths:
      - .github/workflows/evidence-rules-readonly.yml
      - scripts/check_evidence_rules_readonly.py
      - src/matching_rules.py
permissions:
  contents: read
env:
  JOBSHEET_RCLONE_RELEASE: '1.75.0'
jobs:
  check:
    if: github.ref == 'refs/heads/codex/evidence-rules-20261005' || github.ref == 'refs/heads/codex/release-evidence-20261005'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        job: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies and test general matching policy
        run: |
          pip install -r requirements.txt
          python -m unittest tests.test_matching_rules -q
      - name: Install rclone
        run: |
          curl --fail --location --output rclone.zip "https://downloads.rclone.org/v${JOBSHEET_RCLONE_RELEASE}/rclone-v${JOBSHEET_RCLONE_RELEASE}-linux-amd64.zip"
          unzip -q rclone.zip
          sudo mv "rclone-v${JOBSHEET_RCLONE_RELEASE}-linux-amd64/rclone" /usr/local/bin/rclone
      - name: Restore credentials and download private index only
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone copyto "googledrive:From_BrotherDevice/.jobsheet-control/asana-device-index.json" /tmp/asana-device-index.json
          rclone copyto "googledrive:From_BrotherDevice/.jobsheet-control/asana-device-index-manifest.json" /tmp/asana-device-index-manifest.json
      - name: Three independent OCR and live Asana checks without cloud writes
        env:
          BATCH_JOB: ${{ matrix.job }}
          BATCH_REPETITIONS: ${{ github.ref == 'refs/heads/codex/release-evidence-20261005' && '1' || '3' }}
          JOBSHEET_PROMOTION_ADAPTER_CHECK: ${{ github.ref == 'refs/heads/codex/release-evidence-20261005' && '1' || '0' }}
          JOBSHEET_ORIGINAL_UPLOAD_DATE: '2026-10-05'
          JOBSHEET_EVIDENCE_LIVE_RULES: '1'
          JOBSHEET_DRY_RUN: '1'
          OCR_PROVIDER: ${{ vars.OCR_PROVIDER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          ASANA_WORKSPACE_GID: ${{ vars.ASANA_WORKSPACE_GID }}
        run: python -m scripts.check_evidence_rules_readonly
      - name: Save anonymous measurements, never source PDFs or private index
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-rules-anonymous-job${{ matrix.job }}
          path: anonymous-results/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove runner credentials
        if: always()
        run: shred -u ~/.config/rclone/rclone.conf 2>/dev/null || true
