name: Jobsheet unattended storage readiness
on:
  workflow_dispatch:
    inputs:
      write_probe:
        description: 'Check one isolated control-folder test object; never process jobsheets'
        type: boolean
        default: false
permissions:
  contents: read
env:
  JOBSHEET_RCLONE_RELEASE: '1.75.0'
  RCLONE_TPSLIMIT: '4'
  RCLONE_TPSLIMIT_BURST: '1'
  RCLONE_RETRIES: '3'
  RCLONE_RETRIES_SLEEP: '10s'
  RCLONE_CONTIMEOUT: '20s'
  RCLONE_TIMEOUT: '2m'
jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install existing transfer tool and dependencies
        run: |
          curl --fail --location --output rclone.zip "https://downloads.rclone.org/v${JOBSHEET_RCLONE_RELEASE}/rclone-v${JOBSHEET_RCLONE_RELEASE}-linux-amd64.zip"
          unzip -q rclone.zip
          sudo mv "rclone-v${JOBSHEET_RCLONE_RELEASE}-linux-amd64/rclone" /usr/local/bin/rclone
          pip install -r requirements.txt
      - name: Restore and validate dedicated Drive configuration
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          python scripts/validate_drive_client.py
      - name: Check the storage used by Stage A and Stage B
        env:
          WRITE_PROBE: ${{ inputs.write_probe }}
        run: |
          if [ "$WRITE_PROBE" = "true" ]; then
            python -m src.drive_readiness --write-probe
          else
            python -m src.drive_readiness
          fi
      - name: Remove runner credentials
        if: always()
        run: shred -u ~/.config/rclone/rclone.conf 2>/dev/null || true
