name: Jobsheet Pending Review - Four Private Samples

# This workflow exists only on the isolated test branch. Changing this file
# starts one bounded read-only trial; production Stage A/B never calls it.
on:
  push:
    branches:
      - codex/backtest-reviewed-20260923
    paths:
      - .github/workflows/jobsheet-pending-review-backtest.yml

permissions:
  contents: read

concurrency:
  group: jobsheet-pending-review-test
  cancel-in-progress: false

env:
  JOBSHEET_RCLONE_RELEASE: '1.75.0'

jobs:
  review:
    if: github.ref == 'refs/heads/codex/backtest-reviewed-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install rclone
        run: |
          curl --fail --location --output rclone.zip \
            "https://downloads.rclone.org/v${JOBSHEET_RCLONE_RELEASE}/rclone-v${JOBSHEET_RCLONE_RELEASE}-linux-amd64.zip"
          unzip -q rclone.zip
          sudo mv "rclone-v${JOBSHEET_RCLONE_RELEASE}-linux-amd64/rclone" /usr/local/bin/
      - name: Restore rclone config
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
      - name: Download four private copies and index
        run: |
          mkdir -p /tmp/jobsheet-backtest
          for id in B01 B04 B07 B10; do
            rclone copyto \
              "googledrive:From_BrotherDevice/.jobsheet-control/backtest-20/${id}.pdf" \
              "/tmp/jobsheet-backtest/${id}.pdf"
          done
          rclone copyto \
            "googledrive:From_BrotherDevice/.jobsheet-control/backtest-20/manifest-reviewed-20260925.json" \
            /tmp/jobsheet-backtest/manifest-reviewed-20260925.json
          echo "81db79beb6ec5e8ec037486a1bded33b0a07d7a2b35093bc39f88b5987a4355e  /tmp/jobsheet-backtest/manifest-reviewed-20260925.json" | sha256sum -c -
          rclone copyto \
            "googledrive:From_BrotherDevice/.jobsheet-control/backtest-20/index-rebuilt-20260924/asana-device-index.json" \
            /tmp/asana-device-index.json
          rclone copyto \
            "googledrive:From_BrotherDevice/.jobsheet-control/backtest-20/index-rebuilt-20260924/asana-device-index-manifest.json" \
            /tmp/asana-device-index-manifest.json
      - run: pip install -r requirements.txt
      # Re-run with bounded phone reread and same-visit corroboration, still read-only.
      - name: Test human-date review without cloud writes
        env:
          JOBSHEET_BACKTEST_DIR: /tmp/jobsheet-backtest
          JOBSHEET_BACKTEST_MANIFEST: /tmp/jobsheet-backtest/manifest-reviewed-20260925.json
          JOBSHEET_REVIEW_REPORT: /tmp/pending-review-anonymous.json
          JOBSHEET_CONTEXT_FIELD_OCR: '1'
          OCR_PROVIDER: deepseek
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          ASANA_WORKSPACE_GID: ${{ vars.ASANA_WORKSPACE_GID }}
          ASANA_INDEX_LOCAL_FILE: /tmp/asana-device-index.json
          ASANA_INDEX_MANIFEST_LOCAL_FILE: /tmp/asana-device-index-manifest.json
        run: python -m src.pending_review_backtest
      - name: Preserve anonymous results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pending-review-anonymous-results
          path: /tmp/pending-review-anonymous.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Clean up rclone credentials
        if: always()
        run: shred -u ~/.config/rclone/rclone.conf 2>/dev/null || true
