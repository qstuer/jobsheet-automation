name: Jobsheet 20-Sample Backtest

on:
  workflow_dispatch:
    inputs:
      ocr_provider:
        description: '本次回测使用的图片服务'
        required: true
        default: deepseek
        type: choice
        options:
          - deepseek
          - nvidia
  # The workflow is absent from main, so its manual Run button is hidden.
  # Only an edit to this test workflow may start the isolated read-only run.
  push:
    branches:
      - codex/backtest-reviewed-20260923
    paths:
      - .github/workflows/jobsheet-backtest.yml

permissions:
  contents: read

concurrency:
  group: jobsheet-private-backtest
  cancel-in-progress: false

env:
  JOBSHEET_RCLONE_RELEASE: '1.75.0'

jobs:
  backtest:
    if: github.ref == 'refs/heads/codex/backtest-reviewed-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install rclone
        run: |
          curl --fail --location --output rclone.zip \
            "https://downloads.rclone.org/v${JOBSHEET_RCLONE_RELEASE}/rclone-v${JOBSHEET_RCLONE_RELEASE}-linux-amd64.zip"
          unzip -q rclone.zip
          sudo mv "rclone-v${JOBSHEET_RCLONE_RELEASE}-linux-amd64/rclone" /usr/local/bin/
      - name: Restore rclone config
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
      - name: Download private fixtures and test-only index
        run: |
          mkdir -p /tmp/jobsheet-backtest
          for n in $(seq -w 1 20); do
            id="B${n}"
            rclone copyto \
              "googledrive:From_BrotherDevice/.jobsheet-control/backtest-20/${id}.pdf" \
              "/tmp/jobsheet-backtest/${id}.pdf"
          done
          rclone copyto \
            "googledrive:From_BrotherDevice/.jobsheet-control/backtest-20/index-rebuilt-20260924/asana-device-index.json" \
            /tmp/asana-device-index.json
          rclone copyto \
            "googledrive:From_BrotherDevice/.jobsheet-control/backtest-20/index-rebuilt-20260924/asana-device-index-manifest.json" \
            /tmp/asana-device-index-manifest.json
          rclone copyto \
            "googledrive:From_BrotherDevice/.jobsheet-control/backtest-20/manifest-reviewed-20260923.json" \
            /tmp/jobsheet-backtest/manifest-reviewed-20260923.json
          echo "089345ec6c4bc16d5896217bd7fe48560455cdcc4b8241f32dca9c2f1550a766  /tmp/jobsheet-backtest/manifest-reviewed-20260923.json" | sha256sum -c -
      - run: pip install -r requirements.txt
      - name: Recheck B08 only without cloud writes
        env:
          JOBSHEET_BACKTEST_DIR: /tmp/jobsheet-backtest
          JOBSHEET_BACKTEST_MANIFEST: /tmp/jobsheet-backtest/manifest-reviewed-20260923.json
          JOBSHEET_BACKTEST_REPORT: /tmp/backtest-results.json
          # First prove the wrong-month safety gate on the known regression.
          # Remove this selection only after the B08 result has been reviewed.
          JOBSHEET_BACKTEST_SAMPLE_IDS: B08
          OCR_PROVIDER: ${{ inputs.ocr_provider || 'deepseek' }}
          # Only this read-only backtest uses the scored single-field strategy.
          # Production Stage B remains unchanged until the 20 samples pass.
          JOBSHEET_CONTEXT_FIELD_OCR: '1'
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          ASANA_WORKSPACE_GID: ${{ vars.ASANA_WORKSPACE_GID }}
          ASANA_INDEX_LOCAL_FILE: /tmp/asana-device-index.json
          ASANA_INDEX_MANIFEST_LOCAL_FILE: /tmp/asana-device-index-manifest.json
        run: python -m src.backtest
      - name: Preserve anonymous results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-anonymous-results
          path: /tmp/backtest-results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Cleanup private files and rclone config
        if: always()
        run: |
          shred -u ~/.config/rclone/rclone.conf 2>/dev/null || true
          rm -rf /tmp/jobsheet-backtest /tmp/asana-device-index.json /tmp/asana-device-index-manifest.json
