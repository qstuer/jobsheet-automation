name: Jobsheet Stage B - Process

# 階段 B：處理員。由「階段 A 完成」自動接力觸發（_SPLIT 有新貨），或手動啟動。不再排程空轉。
on:
  workflow_run:
    workflows: ["Jobsheet Stage A - Split"]
    types: [completed]
  workflow_dispatch:
    inputs:
      jobsheet_file:
        description: '只處理指定資料夾內這一份 PDF；留空才處理全部'
        required: false
        type: string
      source_queue:
        description: '檔案所在位置'
        required: true
        default: split
        type: choice
        options:
          - split
          - pending
      dry_run:
        description: '只辨認及核對，不移動檔案、不寫入 OneDrive'
        required: true
        default: false
        type: boolean
      ocr_provider:
        description: '手動測試本次使用的圖片服務；自動流程不受影響'
        required: true
        default: nvidia
        type: choice
        options:
          - nvidia
          - deepseek
      confirmed_filename:
        description: '人工已核對的確定檔名（不含 .pdf）；只可配合指定單檔使用'
        required: false
        type: string

permissions:
  contents: read

env:
  # 不可命名為 RCLONE_VERSION；rclone 會把 RCLONE_* 環境變數
  # 當成自己的命令選項，將 1.75.0 誤當成布林值而拒絕啟動。
  JOBSHEET_RCLONE_RELEASE: '1.75.0'

concurrency:
  group: jobsheet-process
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 只在「手動啟動」或「階段A成功完成」時跑（避免階段A失敗還硬接力）
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install rclone
        run: |
          curl --fail --location --output rclone.zip \
            "https://downloads.rclone.org/v${JOBSHEET_RCLONE_RELEASE}/rclone-v${JOBSHEET_RCLONE_RELEASE}-linux-amd64.zip"
          unzip -q rclone.zip
          sudo mv "rclone-v${JOBSHEET_RCLONE_RELEASE}-linux-amd64/rclone" /usr/local/bin/
          rclone version
      - name: Restore rclone config
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes
      - name: Restore private Asana device index
        run: |
          rclone copyto \
            "googledrive:From_BrotherDevice/.jobsheet-control/asana-device-index.json" \
            /tmp/asana-device-index.json
          rclone copyto \
            "googledrive:From_BrotherDevice/.jobsheet-control/asana-device-index-manifest.json" \
            /tmp/asana-device-index-manifest.json
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Show queue before processing
        run: python -m src.healthcheck
      - name: Run processor
        env:
          # 手動執行可只為本次選 DeepSeek；workflow_run 沒有 inputs，仍使用
          # repository variable，未設定時由 src/config.py 保持 NVIDIA 預設。
          OCR_PROVIDER:         ${{ inputs.ocr_provider || vars.OCR_PROVIDER }}
          DEEPSEEK_API_KEY:     ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL:       ${{ vars.DEEPSEEK_MODEL }}
          NVIDIA_API_KEY:       ${{ secrets.NVIDIA_API_KEY }}
          # 模型名稱不是敏感資料；未設定 variable 時使用 src/config.py 的 Nemotron。
          NVIDIA_MODEL:         ${{ vars.NVIDIA_MODEL }}
          ASANA_TOKEN:          ${{ secrets.ASANA_TOKEN }}
          # Workspace 編號不是密鑰。未設定 variable 時，程式使用已核對的預設 workspace。
          ASANA_WORKSPACE_GID:  ${{ vars.ASANA_WORKSPACE_GID }}
          # 手動測試可指定一份；Stage A 自動接力時此值為空，維持正常批次。
          JOBSHEET_TARGET_FILE: ${{ inputs.jobsheet_file }}
          JOBSHEET_SOURCE_QUEUE: ${{ inputs.source_queue || 'split' }}
          JOBSHEET_DRY_RUN:      ${{ inputs.dry_run || 'false' }}
          JOBSHEET_CONFIRMED_FILENAME: ${{ inputs.confirmed_filename }}
          ASANA_INDEX_LOCAL_FILE: /tmp/asana-device-index.json
          ASANA_INDEX_MANIFEST_LOCAL_FILE: /tmp/asana-device-index-manifest.json
        run: python -m src.processor
      - name: Cleanup rclone config
        if: always()
        run: shred -u ~/.config/rclone/rclone.conf 2>/dev/null || true
